apiVersion: apps/v1
kind: Deployment
metadata: 
  name: nginx-deployment-volume
  labels:
    type: volume-configmap

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      name: flask-pod
      labels:
        app: flask
    spec:
      containers:
      - name: flask-container
        image: nginx
        imagePullPolicy: IfNotPresent
        ports:
         - containerPort: 80
        volumeMounts:
          - name: nginx-html
            mountPath: /usr/share/nginx/html

      volumes:
      - name: nginx-html
        configMap:
           name: nginx-configmap-volume
