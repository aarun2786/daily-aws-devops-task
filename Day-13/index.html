<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyberpunk Animation</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #0f0f0f, #000000);
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
    }

    h1 {
      font-size: 4em;
      color: #00fff7;
      text-shadow: 
        0 0 10px #00fff7,
        0 0 20px #00fff7,
        0 0 40px #ff00de,
        0 0 80px #ff00de;
      animation: flicker 2s infinite alternate;
    }

    @keyframes flicker {
      0% { opacity: 1; }
      25% { opacity: 0.8; }
      50% { opacity: 0.6; }
      75% { opacity: 0.9; }
      100% { opacity: 1; }
    }

    .scanlines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.05) 0px,
        rgba(255,255,255,0.05) 2px,
        transparent 2px,
        transparent 4px
      );
      animation: moveScan 5s linear infinite;
      pointer-events: none;
    }

    @keyframes moveScan {
      from { transform: translateY(0); }
      to { transform: translateY(10px); }
    }
  </style>
</head>
<body>
  <h1>ARUN</h1>
  <div class="scanlines"></div>
</body>
</html>
