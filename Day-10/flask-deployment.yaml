apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment

spec:
  replicas: 3

  selector:
    matchLabels:
          app: flask-app


  template:
    metadata:
      name: flask-pod
      labels:
          app: flask-app

    spec:
     containers:
          - name: flask-container
            image: flask-server:v1
            imagePullPolicy: Never
            ports:
              - containerPort: 5000
