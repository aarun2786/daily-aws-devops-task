apiVersion: apps/v1
kind: Deployment
metadata: 
  name: flask-deployment
  labels:
    env: prod
    type: deploy
  namespace: prod

spec:
  replicas: 2

  selector:
    matchLabels:
      app: flask

  template:
    metadata:
      name: flask-pod
      labels:
        app: flask
        env: prod
    spec:
      containers:
      - name: flask-container
        image: aarun2786/flask-img:v1
        imagePullPolicy: Always
        ports:
         - containerPort: 5000

