<!DOCTYPE html>
<html>
<head>
  <title>User Counter</title>
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f0f4f8; }
    .card { background: white; border-radius: 16px; padding: 48px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { font-size: 80px; margin: 0; color: #4f46e5; }
    p { color: #888; margin: 8px 0 32px; }
    button { padding: 12px 28px; margin: 8px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
    .join  { background: #4f46e5; color: white; }
    .leave { background: #ef4444; color: white; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="count">0</h1>
    <p>active users</p>
    <button class="join"  onclick="hit('/join')">Join</button>
    <button class="leave" onclick="hit('/leave')">Leave</button>
  </div>

  <script>
    // Change this to your Flask API address
    const API = '/api';

    function hit(path) {
      fetch(API + path)
        .then(r => r.json())
        .then(d => document.getElementById('count').textContent = d.users);
    }

    // Load count on page open
    hit('/count');
  </script>
</body>
</html>
